<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penguin World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- ================= LOGIN SCREEN ================= -->
    <section id="screen-login" class="screen screen--auth active">
      <div class="auth-card">
        <h1 class="logo">Penguin&nbsp;World</h1>
        <p class="tagline">A tiny shared world. Hop in!</p>

        <form id="form-login" class="auth-form" autocomplete="off">
          <label>
            Username
            <input type="text" name="username" maxlength="20" required />
          </label>
          <label>
            Password
            <input type="password" name="password" maxlength="100" required />
          </label>
          <button type="submit" class="btn btn--primary">Log in</button>
          <p class="form-error" id="login-error"></p>
        </form>

        <p class="switch">
          New here?
          <a href="#" data-goto="register">Create an account</a>
        </p>
      </div>
    </section>

    <!-- ================= REGISTER SCREEN ================= -->
    <section id="screen-register" class="screen screen--auth">
      <div class="auth-card">
        <h1 class="logo">Create Avatar</h1>
        <p class="tagline">Pick a name and a color.</p>

        <form id="form-register" class="auth-form" autocomplete="off">
          <label>
            Username
            <input type="text" name="username" maxlength="20" required />
          </label>
          <label>
            Password
            <input type="password" name="password" maxlength="100" required />
          </label>
          <label class="color-label">
            Body color
            <span class="color-row">
              <input type="color" name="bodyColor" value="#3498db" />
              <span class="color-preview" id="color-preview"></span>
            </span>
          </label>
          <button type="submit" class="btn btn--primary">Create &amp; play</button>
          <p class="form-error" id="register-error"></p>
        </form>

        <p class="switch">
          Already have an account?
          <a href="#" data-goto="login">Log in</a>
        </p>
      </div>
    </section>

    <!-- ================= GAME SCREEN ================= -->
    <section id="screen-game" class="screen screen--game">
      <header class="game-topbar">
        <span class="logo logo--small">Penguin World</span>
        <div class="topbar-right">
          <span class="online-pill">
            <span class="dot"></span>
            Online: <strong id="online-count">0</strong>
          </span>
          <span class="me-pill" id="me-pill"></span>
          <button id="btn-logout" class="btn btn--ghost">Log out</button>
        </div>
      </header>

      <div class="stage-wrap">
        <canvas id="game-canvas" width="960" height="540"></canvas>
      </div>

      <form id="form-chat" class="chat-bar">
        <input
          type="text"
          id="chat-input"
          maxlength="120"
          placeholder="Say something to the room..."
          autocomplete="off"
        />
        <button type="submit" class="btn btn--primary">Send</button>
        <span class="chat-hint" id="chat-hint"></span>
      </form>
    </section>

    <!-- socket.io client is served by the socket.io server -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/game.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
